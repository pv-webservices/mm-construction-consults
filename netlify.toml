# Netlify configuration for mmconstructionconsults.com (GitHub auto-deploy from `main`).
# Secrets (SMTP_PASS etc.) are NOT set here: variables in this file are not available to Functions.
# Set them in Netlify > Site configuration > Environment variables. See docs/EMAIL-SETUP.md.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# ---------- Redirects ----------
# HTTP -> HTTPS is automatic on Netlify (Force HTTPS). www -> apex: the apex is the primary domain;
# these rules make it a single explicit 301 for every path.
[[redirects]]
  from = "https://www.mmconstructionconsults.com/*"
  to = "https://mmconstructionconsults.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mmconstructionconsults.com/*"
  to = "https://mmconstructionconsults.com/:splat"
  status = 301
  force = true

# The old sitemap URL.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Trailing slashes: every page is /path/index.html, so Netlify answers /path with 301 -> /path/.
# /index.html -> / is handled by netlify/edge-functions/strip-index-html.ts.

# ---------- Headers (static files only; the contact function sets its own) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Content-hashed build assets (CSS, JS, fonts) never change: cache for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and videos keep their file names between releases: cache for a week, then revalidate.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"
